# Darwin20 Demo, a Bern application. `bern run` builds it and starts it on this
# computer; `bern build --target <name>` builds one of the targets below.

[app]
id = "darwin20_demo"
# Change this to a reverse-DNS name you own before you ship.
bundle_id = "dev.bern.darwin20demo"
version = "0.1.0"
name = { "zh-Hans" = "Darwin20 Demo", "en" = "Darwin20 Demo" }
# A square PNG of 1024 pixels; without it the app uses the Bern logo.
# icon = "icon.png"
# Or a table giving platforms their own icons, as a square PNG or in the
# platform's own form; `default` covers the rest:
# icon = { default = "icon.png", macos = "icons/App.icns", windows = "icons/app.ico", ios = "icons/AppIcon.appiconset", android = "icons/android/res", linux = "icons/hicolor", browser = "icons/web" }
# Shown by installers and package managers.
# publisher = "Your Name"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"

[protocol]
package = "darwin20-demo-protocol"
source = "darwin20-demo-protocol/src/lib.rs"

[engine]
package = "darwin20-demo-core"
type = "darwin20_demo_core::Darwin20DemoEngine"

[ui]
package = "darwin20-demo-ui"
sources = ["darwin20-demo-ui/src/lib.rs"]
root = "app"

# `channels = ["ipc"]` lets the generated command line and MCP server drive
# the running app. Remove it to ship an app that listens to nothing.

[targets.macos]
platform = "macos"
channels = ["ipc"]

# iOS, built for the simulator; `bern run --target ios` starts it in the
# simulator that is running.
[targets.ios]
platform = "ios"
channels = ["ipc"]

# The same declaration and renderer, with no Swift runtime in the app.
[targets.macos_objc]
platform = "macos"
ui = "appkit"
channels = ["ipc"]

[targets.ios_objc]
platform = "ios"
ui = "uikit"
channels = ["ipc"]

# Build an arm64 iOS 14+ device bundle locally, without installing it or
# contacting Apple provisioning services.
[targets.ios_device]
platform = "ios"
ui = "uikit"
destination = "device"

[targets.ios_swiftui_device]
platform = "ios"
destination = "device"

[targets.windows]
platform = "windows"
channels = ["ipc"]
# WinUI 3 where Windows has a Windows App Runtime 2, the system XAML
# elsewhere. Name one front end to build only that one.
# frontends = ["winui3", "xaml-islands"]

[targets.linux]
platform = "linux"
channels = ["ipc"]

# Android phones; `bern run --target android` installs the app on the
# connected device and starts it.
[targets.android]
platform = "android"
channels = ["ipc"]

[targets.web_app]
ui = "web"
platform = "browser"
web_mode = "app"

name: Gallery Film Last observer build
run-name: Build exact e48 Film Last observer for macOS 13

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: film-last-observer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: e48fff46b3a92a28465ad74295bd273a9d69af7d
          path: source
          persist-credentials: false
      - name: Bind exact source, frozen observation packet, and compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git -C source rev-parse HEAD)" = e48fff46b3a92a28465ad74295bd273a9d69af7d
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.2
          {
            printf 'source_sha=%s\nharness_sha=%s\n' e48fff46b3a92a28465ad74295bd273a9d69af7d "$GITHUB_SHA"
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun swiftc -version
          } > evidence/environment.txt 2>&1
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['xcrun', 'swiftc', '-version'], text=True)
          assert re.search(r'Apple Swift version 6\.', version), version
          PY
          rustup toolchain install 1.99.0 --profile minimal
          rustc +1.99.0 -Vv >> evidence/environment.txt
          packet=harness/.github/scripts/film-last-observer
          test "$(shasum -a 256 "$packet/source-SHA256SUMS" | awk '{print $1}')" = f939a41d78a5d78cbcdc51d2341952c200aa5187bb6befa2331521eb03565741
          (cd "$packet" && shasum -a 256 -c source-SHA256SUMS)
          test "$(shasum -a 256 harness/.github/scripts/frame-source-export.py | awk '{print $1}')" = 5b4a254565f437f819a308f8cf3c5b1990b937f76b9918ff5b935e91e1a2b017
          shasum -a 256 "$packet/build.py" "$packet/patch.py" "$packet/FilmLastObservation.swift.inc" "$packet/README.md" "$packet/source-proof.json" "$packet/source-SHA256SUMS" "$packet/README.build.md" harness/.github/scripts/frame-source-export.py harness/.github/workflows/macos13-film-last-observer-build.yml > evidence/harness-inputs.sha256
      - name: Prepare the two exact diagnostic templates
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          unset BERN_DIAGNOSTIC_GENERATE_ONLY BERN_FILM_LAST_OBSERVATION_FILE
          python3 harness/.github/scripts/film-last-observer/build.py prepare source evidence
      - name: Generate and complete the original full product build plan
        shell: bash
        run: |
          set +e
          unset BERN_DIAGNOSTIC_GENERATE_ONLY BERN_FILM_LAST_OBSERVATION_FILE
          (cd source && cargo +1.99.0 run --locked --release -p bern-cli -- build --manifest examples/gallery/Bern.toml --target macos_modern --release) > evidence/build.full.log 2>&1
          result=$?
          printf '%s\n' "$result" > evidence/build.exit-code.txt
          exit "$result"
      - name: Collect actual generated inputs and product provenance including failures
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: python3 harness/.github/scripts/film-last-observer/build.py collect source evidence
      - name: Independently verify this build's binaries without launching them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('source/target/bern/macos_modern/build.json').read_text())
          assert d['ui'] == 'swiftui-modern' and d['minimum_macos'] == '13.0' and d['profile'] == 'release', d
          PY
          app=source/target/bern/macos_modern/Gallery.app
          cli=source/target/bern/macos_modern/bin/gallery
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$app/Contents/Info.plist")" = 13.0
          {
            codesign --verify --deep --strict "$app"
            for binary in "$app/Contents/MacOS/Gallery" "$cli"; do
              test -x "$binary"
              test "$(lipo -archs "$binary")" = arm64
              test "$(xcrun vtool -show-build "$binary" | awk '/minos/ {print $2;exit}')" = 13.0
              test "$(xcrun vtool -show-build "$binary" | awk '/sdk/ {print $2;exit}')" = 26.2
              codesign --verify --strict "$binary"
              xcrun vtool -show-build "$binary"
              shasum -a 256 "$binary"
            done
          } > evidence/workflow-binary-verification.txt 2>&1
          (cd evidence && shasum -a 256 -c gallery-film-last-observer.tar.gz.sha256)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: film-last-observer-build
          path: |
            evidence/
            !evidence/build.full.log
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
